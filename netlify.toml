[build]
  command = "bun install && bun run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "18"
  BUN_VERSION = "1.1.20"
  NPM_FLAGS = "--prefer-offline --no-audit"

[[plugins]]
package = "netlify-plugin-cache"
  [plugins.inputs]
    paths = [
      ".cache",
      "bun.lockb",
      "dist"
    ]

[build.processing]
  skip_processing = false

[build.processing.css]
  bundle = true
  minify = true

[build.processing.js]
  bundle = true
  minify = true

[build.processing.html]
  pretty_urls = true
